name: Frontend checks

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'chore/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:web
      - name: Export native bundles
        working-directory: apps/mobile
        run: npx expo export --platform android --platform ios --output-dir dist
        env:
          EXPO_PUBLIC_API_URL: https://example.invalid/api/v1

  user-flows:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qsale_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qsale_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
    env:
      PORT: '19080'
      DB_PORT: '5433'
      DB_NAME: qsale_test
      DB_PASSWORD: integration-test-only
      JWT_SECRET: integration-test-key-not-used-outside-disposable-ci-2026
      SHOW_SQL: 'false'
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173,http://127.0.0.1:8081
      EXPO_PUBLIC_API_URL: http://127.0.0.1:19080/api/v1
      EXPO_PUBLIC_WEB_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: mvn -B package -DskipTests
      - name: Start the isolated API
        shell: bash
        run: |
          java -jar target/qsale-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/qsale-api.log" 2>&1 &
          echo "QSALE_API_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:19080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/qsale-api.log"
          exit 1
      - name: Run web and shared coordination journeys
        run: npm run test:web
      - name: Run mobile browser journeys
        run: npm run test:mobile-form
      - name: Stop the API
        if: always()
        run: |
          if [ -n "${QSALE_API_PID:-}" ]; then kill "$QSALE_API_PID" || true; fi
      - name: Retain failed test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-user-flows
          path: |
            test-results/
            apps/web/test-results/
            apps/mobile/test-results/
            ${{ runner.temp }}/qsale-api.log
          retention-days: 3
